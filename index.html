<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outfit Me 🎀</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff5fa,#fce5f0);
  color:#4d3442;
}

header{
  text-align:center;
  padding:28px 15px 18px;
}

h1{
  margin:0;
  color:#d95791;
  font-size:36px;
}

.subtitle{
  margin-top:7px;
  color:#987184;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:rgba(255,255,255,.94);
  border-radius:26px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 8px 28px rgba(170,80,125,.12);
}

h2{
  color:#c94f85;
  margin-top:0;
}

.categories,
.colors,
.occasions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

button{
  font-family:inherit;
}

.choice{
  border:0;
  padding:12px 6px;
  border-radius:16px;
  background:#fff0f6;
  color:#70465a;
  cursor:pointer;
  font-size:14px;
}

.choice.selected{
  background:#e56d9f;
  color:white;
}

input[type=file]{
  width:100%;
  margin:16px 0;
}

.main-button{
  width:100%;
  border:0;
  padding:16px;
  border-radius:19px;
  background:#df6298;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.main-button:active{
  transform:scale(.98);
}

.closet{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.item{
  position:relative;
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.item img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  display:block;
}

.delete{
  position:absolute;
  top:6px;
  left:6px;
  width:31px;
  height:31px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  cursor:pointer;
}

.badge{
  padding:7px 10px;
  font-size:12px;
  text-align:center;
  background:#fff4f8;
}

.outfit{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:18px;
}

.outfit .item{
  border-radius:21px;
}

.match{
  margin-top:15px;
  padding:14px;
  border-radius:17px;
  text-align:center;
  font-weight:bold;
  background:#f8e8f0;
}

.saved{
  margin-top:20px;
}

.empty{
  text-align:center;
  padding:25px;
  color:#987486;
  grid-column:1/-1;
}

.small{
  color:#987486;
  font-size:13px;
  margin-top:8px;
  text-align:center;
}

@media(max-width:650px){
  .categories,
  .colors,
  .occasions{
    grid-template-columns:repeat(2,1fr);
  }

  .closet{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>Outfit Me 🎀</h1>
  <div class="subtitle">הארון הדיגיטלי שלי 👗✨</div>
</header>

<div class="container">

<!-- ADD ITEM -->
<div class="card">
  <h2>➕ הוסיפי בגד לארון</h2>

  <p><b>מה סוג הפריט?</b></p>

  <div class="categories">
    <button class="choice selected" data-category="top">👚 חולצה</button>
    <button class="choice" data-category="bottom">👖 מכנס</button>
    <button class="choice" data-category="skirt">🩷 חצאית</button>
    <button class="choice" data-category="dress">👗 שמלה</button>
    <button class="choice" data-category="outer">🧥 עליונית</button>
    <button class="choice" data-category="shoes">👟 נעליים</button>
    <button class="choice" data-category="bag">👜 תיק</button>
    <button class="choice" data-category="accessory">🎀 אקססורי</button>
  </div>

  <p><b>איזה צבע?</b></p>

  <div class="colors">
    <button class="choice selected" data-color="white">🤍 לבן</button>
    <button class="choice" data-color="black">🖤 שחור</button>
    <button class="choice" data-color="gray">🩶 אפור</button>
    <button class="choice" data-color="cream">🤍 שמנת</button>
    <button class="choice" data-color="pink">🩷 ורוד</button>
    <button class="choice" data-color="red">❤️ אדום</button>
    <button class="choice" data-color="orange">🧡 כתום</button>
    <button class="choice" data-color="yellow">💛 צהוב</button>
    <button class="choice" data-color="green">💚 ירוק</button>
    <button class="choice" data-color="lightblue">🩵 תכלת</button>
    <button class="choice" data-color="blue">💙 כחול</button>
    <button class="choice" data-color="purple">💜 סגול</button>
    <button class="choice" data-color="brown">🤎 חום</button>
    <button class="choice" data-color="denim">👖 ג'ינס</button>
  </div>

  <input type="file" id="photoInput" accept="image/*">

  <button class="main-button" onclick="addItem()">
    💗 הוסיפי לארון
  </button>

  <div class="small">
    לא צריך לתת שם לבגד — רק תמונה, סוג וצבע 🎀
  </div>
</div>


<!-- CLOSET -->
<div class="card">
  <h2>🧺 הארון שלי</h2>
  <div id="closet" class="closet"></div>
</div>


<!-- OUTFIT GENERATOR -->
<div class="card">

  <h2>✨ הרכיבי לי אאוטפיט</h2>

  <p><b>לאן את יוצאת?</b></p>

  <div class="occasions">
    <button class="choice" onclick="chooseOccasion(this)">🏫 בית ספר</button>
    <button class="choice" onclick="chooseOccasion(this)">👯‍♀️ יציאה עם חברות</button>
    <button class="choice" onclick="chooseOccasion(this)">👨‍👩‍👧‍👦 יציאה עם המשפחה</button>
    <button class="choice" onclick="chooseOccasion(this)">🎉 חג אצל חברים</button>
    <button class="choice" onclick="chooseOccasion(this)">🏠 חג אצל המשפחה</button>
    <button class="choice" onclick="chooseOccasion(this)">🍽️ ארוחת שישי</button>
    <button class="choice" onclick="chooseOccasion(this)">✨ יום רגיל</button>
  </div>

  <br>

  <button class="main-button" onclick="generateOutfit()">
    🎀 תמצאי לי אאוטפיט
  </button>

  <div id="match"></div>

  <div id="outfit" class="outfit"></div>

  <br>

  <button id="again" class="main-button" style="display:none" onclick="generateOutfit()">
    🔄 עוד אאוטפיט
  </button>

  <br>

  <button id="saveOutfit" class="main-button" style="display:none" onclick="saveOutfit()">
    ❤️ שמרי את האאוטפיט
  </button>

</div>


<!-- SAVED OUTFITS -->
<div class="card">
  <h2>❤️ האאוטפיטים ששמרתי</h2>
  <div id="savedOutfits" class="outfit"></div>
</div>

</div>


<script>

let clothes = JSON.parse(localStorage.getItem("outfitMeCloset")) || [];
let savedOutfits = JSON.parse(localStorage.getItem("outfitMeSaved")) || [];

let selectedCategory = "top";
let selectedColor = "white";
let selectedOccasion = "";
let currentOutfit = [];


/* CATEGORY */

document.querySelectorAll("[data-category]").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll("[data-category]")
      .forEach(b => b.classList.remove("selected"));

    button.classList.add("selected");

    selectedCategory = button.dataset.category;
  });

});


/* COLOR */

document.querySelectorAll("[data-color]").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll("[data-color]")
      .forEach(b => b.classList.remove("selected"));

    button.classList.add("selected");

    selectedColor = button.dataset.color;
  });

});


/* ADD ITEM */

function addItem(){

  const input = document.getElementById("photoInput");

  if(!input.files.length){
    alert("תבחרי תמונה של הבגד 💗");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    clothes.push({
      id:Date.now(),
      category:selectedCategory,
      color:selectedColor,
      image:e.target.result
    });

    localStorage.setItem(
      "outfitMeCloset",
      JSON.stringify(clothes)
    );

    renderCloset();

    input.value="";
  };

  reader.readAsDataURL(input.files[0]);
}


/* SHOW CLOSET */

function renderCloset(){

  const closet=document.getElementById("closet");

  if(!clothes.length){

    closet.innerHTML=`
      <div class="empty">
        🥹🎀<br>
        הארון שלך עדיין ריק<br>
        תוסיפי את הבגדים שלך!
      </div>
    `;

    return;
  }

  closet.innerHTML="";

  clothes.forEach(item=>{

    const div=document.createElement("div");

    div.className="item";

    div.innerHTML=`
      <img src="${item.image}">
      <div class="badge">${colorName(item.color)}</div>
      <button class="delete" onclick="deleteItem(${item.id})">🗑️</button>
    `;

    closet.appendChild(div);

  });
}


/* DELETE */

function deleteItem(id){

  clothes=clothes.filter(item=>item.id!==id);

  localStorage.setItem(
    "outfitMeCloset",
    JSON.stringify(clothes)
  );

  renderCloset();
}


/* OCCASION */

function chooseOccasion(button){

  document.querySelectorAll(".occasions .choice")
    .forEach(b=>b.classList.remove("selected"));

  button.classList.add("selected");

  selectedOccasion=button.innerText;
}


/* COLOR COMPATIBILITY */

const compatible = {

  white:["black","gray","cream","pink","red","orange","yellow","green","lightblue","blue","purple","brown","denim"],

  black:["white","gray","cream","pink","red","orange","yellow","green","lightblue","blue","purple","brown","denim"],

  gray:["white","black","cream","pink","red","lightblue","blue","purple","denim"],

  cream:["white","black","brown","pink","green","lightblue","blue","denim"],

  pink:["white","black","gray","cream","brown","denim","purple"],

  red:["white","black","gray","cream","denim","brown"],

  orange:["white","black","cream","brown","denim","blue"],

  yellow:["white","black","gray","cream","brown","blue","denim"],

  green:["white","black","cream","brown","denim","yellow"],

  lightblue:["white","gray","cream","pink","brown","denim","navy","black"],

  blue:["white","black","gray","cream","orange","brown","yellow","denim"],

  purple:["white","black","gray","cream","pink","denim"],

  brown:["white","cream","pink","orange","green","lightblue","blue","denim"],

  denim:["white","black","gray","cream","pink","red","orange","yellow","green","lightblue","blue","purple","brown"]
};


/* CHECK COLORS */

function colorScore(a,b){

  if(a===b) return 7;

  if(compatible[a] && compatible[a].includes(b)) return 10;

  return 0;
}


/* RANDOM ITEM WITH COLOR */

function bestItem(category, chosenColors){

  const options=clothes.filter(
    item=>item.category===category
  );

  if(!options.length) return null;

  let scored=options.map(item=>{

    let score=0;

    chosenColors.forEach(color=>{
      score+=colorScore(item.color,color);
    });

    return {item,score};

  });

  scored.sort((a,b)=>b.score-a.score);

  const bestScore=scored[0].score;

  const best=scored.filter(x=>x.score===bestScore);

  return best[Math.floor(Math.random()*best.length)].item;
}


/* GENERATE OUTFIT */

function generateOutfit(){

  if(!selectedOccasion){

    alert("קודם תבחרי לאן את יוצאת 🎀");
    return;
  }

  if(!clothes.length){

    alert("קודם תוסיפי בגדים לארון שלך 👗");
    return;
  }

  let outfit=[];
  let colors=[];

  const dressOptions=clothes.filter(
    item=>item.category==="dress"
  );

  const useDress=dressOptions.length && Math.random()>0.55;

  if(useDress){

    const dress=dressOptions[
      Math.floor(Math.random()*dressOptions.length)
    ];

    outfit.push(dress);
    colors.push(dress.color);

  }else{

    const top=bestItem("top",colors);

    if(top){
      outfit.push(top);
      colors.push(top.color);
    }

    const bottom=bestItem("bottom",colors);
    const skirt=bestItem("skirt",colors);

    let lower=bottom || skirt;

    if(bottom && skirt){
      lower=Math.random()>0.5 ? bottom : skirt;
    }

    if(lower){
      outfit.push(lower);
      colors.push(lower.color);
    }
  }

  const outer=bestItem("outer",colors);

  if(outer && Math.random()>0.5){
    outfit.push(outer);
    colors.push(outer.color);
  }

  const shoes=bestItem("shoes",colors);

  if(shoes){
    outfit.push(shoes);
    colors.push(shoes.color);
  }

  const bag=bestItem("bag",colors);

  if(bag && Math.random()>0.3){
    outfit.push(bag);
    colors.push(bag.color);
  }

  const accessory=bestItem("accessory",colors);

  if(accessory && Math.random()>0.5){
    outfit.push(accessory);
  }

  currentOutfit=outfit;

  showOutfit();

  document.getElementById("again").style.display="block";
  document.getElementById("saveOutfit").style.display="block";

  showMatch(colors);
}


/* SHOW OUTFIT */

function showOutfit(){

  const container=document.getElementById("outfit");

  container.innerHTML="";

  if(!currentOutfit.length){

    container.innerHTML=`
      <div class="empty">
        אין מספיק פריטים מתאימים עדיין 🥹
      </div>
    `;

    return;
  }

  currentOutfit.forEach(item=>{

    const div=document.createElement("div");

    div.className="item";

    div.innerHTML=`
      <img src="${item.image}">
      <div class="badge">${colorName(item.color)}</div>
    `;

    container.appendChild(div);

  });
}


/* MATCH MESSAGE */

function showMatch(colors){

  let score=0;
  let checks=0;

  for(let i=0;i<colors.length;i++){

    for(let j=i+1;j<colors.length;j++){

      score+=colorScore(colors[i],colors[j]);
      checks++;
    }
  }

  let percentage=checks
    ? Math.min(100,Math.round(score/(checks*10)*100))
    : 100;

  let message="";

  if(percentage>=85){
    message="💚 התאמת צבעים מושלמת!";
  }else if(percentage>=65){
    message="💛 צבעים שהולכים יפה ביחד!";
  }else{
    message="🎀 שילוב מיוחד — שווה לנסות!";
  }

  document.getElementById("match").innerHTML=`
    <div class="match">
      ${message}<br>
      התאמת צבעים: ${percentage}%
    </div>
  `;
}


/* SAVE OUTFIT */

function saveOutfit(){

  if(!currentOutfit.length) return;

  savedOutfits.push(
    currentOutfit.map(item=>({
      image:item.image,
      category:item.category,
      color:item.color
    }))
  );

  localStorage.setItem(
    "outfitMeSaved",
    JSON.stringify(savedOutfits)
  );

  renderSaved();

  alert("האאוטפיט נשמר ❤️");
}


/* SAVED OUTFITS */

function renderSaved(){

  const container=document.getElementById("savedOutfits");

  container.innerHTML="";

  if(!savedOutfits.length){

    container.innerHTML=`
      <div class="empty">
        עדיין לא שמרת אאוטפיטים 💗
      </div>
    `;

    return;
  }

  savedOutfits.forEach((outfit,index)=>{

    const wrapper=document.createElement("div");

    wrapper.className="card";

    wrapper.style.margin="0";

    wrapper.innerHTML=`
      <div class="outfit">
        ${outfit.map(item=>`
          <div class="item">
            <img src="${item.image}">
          </div>
        `).join("")}
      </div>
      <br>
      <button class="main-button"
        onclick="deleteSaved(${index})">
        🗑️ מחקי אאוטפיט
      </button>
    `;

    container.appendChild(wrapper);

  });
}


/* DELETE SAVED */

function deleteSaved(index){

  savedOutfits.splice(index,1);

  localStorage.setItem(
    "outfitMeSaved",
    JSON.stringify(savedOutfits)
  );

  renderSaved();
}


/* COLOR NAMES */

function colorName(color){

  const names={
    white:"לבן 🤍",
    black:"שחור 🖤",
    gray:"אפור 🩶",
    cream:"שמנת 🤍",
    pink:"ורוד 🩷",
    red:"אדום ❤️",
    orange:"כתום 🧡",
    yellow:"צהוב 💛",
    green:"ירוק 💚",
    lightblue:"תכלת 🩵",
    blue:"כחול 💙",
    purple:"סגול 💜",
    brown:"חום 🤎",
    denim:"ג'ינס 👖"
  };

  return names[color] || "";
}


renderCloset();
renderSaved();

</script>

</body>
      </html>
